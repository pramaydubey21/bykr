# Local services for bykr. Two databases, deliberately:
#   postgres -> relational integrity (users, rides, alerts, embeddings via pgvector)
#   mongo    -> high-volume append-only telemetry (location pings, motion samples)
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bykr-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bykr
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bykr"]
      interval: 3s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:7
    container_name: bykr-mongo
    environment:
      MONGO_INITDB_DATABASE: bykr
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
      # Runs once on first start: collections, validators and indexes.
      - ./mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
  mongodata:
